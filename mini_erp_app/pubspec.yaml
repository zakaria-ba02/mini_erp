name: mini_erp_app
description: "Mini ERP — Flutter frontend (Admin / Customer)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Core
  get: ^4.7.2
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0
  intl: ^0.19.0
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.5.3

  # UI / motion
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/tarteel_logo.png
